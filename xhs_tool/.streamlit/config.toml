[theme]
base = "dark"
primaryColor = "#a855f7"
backgroundColor = "#08080c"
secondaryBackgroundColor = "#13131a"
textColor = "#f5f5f7"
font = "sans serif"

[server]
headless = true
runOnSave = false
showErrorDetails = true
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
toolbarMode = "minimal"
